# Local stack: `docker compose up -d --wait`, then `ng serve` in frontend/. See README.md.
# Every key has a dev default, so a fresh clone runs without a .env; .env.example lists them.

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: dabubble
      POSTGRES_USER: dabubble
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dabubble}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Over TCP, because the init scripts run against a socket-only server that isn't ready yet.
      test:
        [
          "CMD",
          "pg_isready",
          "-h",
          "127.0.0.1",
          "-U",
          "dabubble",
          "-d",
          "dabubble",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: start-dev --import-realm
    # The realm JSON's ${...} placeholders read these; .env is optional and the JSON has defaults.
    env_file:
      - path: .env
        required: false
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      # Tokens carry the browser-facing issuer; the backend still reaches Keycloak as keycloak:8080.
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The image has no curl or wget; bash's /dev/tcp does the request. CMD-SHELL keeps it one string.
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000 && printf "GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && head -n 1 <&3 | grep -q " 200"'
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    command: mini -dir=/data -bucket=dabubble
    environment:
      # Becomes the S3 admin identity; without one the S3 API would accept unsigned requests.
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-dabubble}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-dabubble-dev-secret}
    ports:
      - "8333:8333"
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      # The bucket is created a moment after the S3 API is up, so wait for the bucket itself.
      test:
        - CMD-SHELL
        - curl -fsI --aws-sigv4 aws:amz:us-east-1:s3 --user "$$AWS_ACCESS_KEY_ID:$$AWS_SECRET_ACCESS_KEY" http://127.0.0.1:8333/dabubble
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.32.0
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    # Same keys host mode reads from ../.env; only the internal endpoints below differ.
    env_file:
      - path: .env
        required: false
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/dabubble
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWKSETURI: http://keycloak:8080/realms/da-bubble/protocol/openid-connect/certs
      DABUBBLE_STORAGE_ENDPOINT: http://seaweedfs:8333
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    healthcheck:
      # The JRE image has no curl or wget; bash's /dev/tcp does the request (/bin/sh is dash).
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/8081 && printf "GET /actuator/health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && head -n 1 <&3 | grep -q " 200"'
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

volumes:
  postgres-data:
  seaweedfs-data:
