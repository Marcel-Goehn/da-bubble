spring.application.name=backend
server.port=8081

# Defaults target the compose stack from the host (./gradlew bootRun). In compose, the backend
# container overrides only the internal endpoints: datasource, JWK set URI and S3 endpoint.
# The root .env is shared with compose; inside the container it arrives as environment variables.
spring.config.import=optional:file:../.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:5432/dabubble
spring.datasource.username=dabubble
spring.datasource.password=${POSTGRES_PASSWORD:dabubble}

# Flyway owns the schema (src/main/resources/db/migration); Hibernate only checks the mapping against it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# The issuer is always the browser-facing URL; only the JWK set is fetched from the internal host.
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/da-bubble
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/realms/da-bubble/protocol/openid-connect/certs
spring.security.oauth2.resourceserver.jwt.audiences=da-bubble-api

# The committed spec (openapi.json, ADR 0004) covers the REST API only, as JSON.
springdoc.paths-to-match=/api/**
springdoc.default-produces-media-type=application/json
springdoc.writer-with-order-by-keys=true

# Backend calls use the endpoint; presigned URLs use the public endpoint the browser can reach.
dabubble.storage.endpoint=http://localhost:8333
dabubble.storage.public-endpoint=http://localhost:8333
dabubble.storage.bucket=dabubble
dabubble.storage.access-key=${S3_ACCESS_KEY:dabubble}
dabubble.storage.secret-key=${S3_SECRET_KEY:dabubble-dev-secret}

# Avatar uploads are the only multipart requests: a file over 5 MB is an AVATAR_TOO_LARGE problem. Tomcat
# reads the rest of a refused request up to the swallow size, so the browser gets that answer, not a reset.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.tomcat.max-swallow-size=20MB
