<!doctype html>
<!--
  PROTOTYPE, throw away. Map #1, ticket #19 "What do search results with Messages look like?"
  Three structurally different variants of mixed search results (Channels, Users, Message text)
  for "Devspace durchsuchen" (desktop) and the mobile "Search" screen.
  Open this file in a browser. Switch variants with the black bar or ←/→ (?variant=A|B|C).
  Fake data, in-memory search; hits newest first, snippets as {text, highlighted} segments (#25).
-->
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Search results prototype</title>
<style>
  :root {
    --purple: #444df2; --purple-2: #535af1; --purple-3: #797ef3; --bg: #eceefe;
    --border: #adb0d9; --grey: #686868; --mark: #d8daff; --online: #92c83e;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); font-family: Nunito, "Segoe UI", system-ui, sans-serif; color: #000; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; text-align: left; }
  input { font: inherit; }
  mark { background: var(--mark); border-radius: 4px; padding: 0 2px; color: #000; }
  .page { padding: 16px 16px 80px; }

  /* Prototype controls (not part of the design) */
  .proto { max-width: 1400px; margin: 0 auto 16px; padding: 10px 12px; border: 2px dashed rgba(0,0,0,.3);
    border-radius: 12px; background: rgba(255,255,255,.6); font: 13px/1.6 ui-monospace, Consolas, monospace;
    display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .proto button { background: #fff; padding: 1px 8px; border-radius: 4px; font: inherit; }
  .proto button.on, .proto button:hover { background: #000; color: #fff; }
  .proto.state { display: block; margin-top: 16px; }

  /* Desktop frame */
  .desk { position: relative; max-width: 1400px; height: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  .desk header { display: flex; align-items: center; gap: 32px; }
  .logo { width: 300px; font-size: 28px; font-weight: 700; }
  .searchwrap { position: relative; flex: 1; }
  .desk .search { width: 100%; border: 0; border-radius: 30px; background: #fff; padding: 16px 32px; font-size: 20px; outline: none; }
  .desk .search.open { border-radius: 30px 30px 0 0; }
  .dropdown { position: absolute; left: 0; right: 0; top: 100%; z-index: 10; max-height: 560px; overflow-y: auto; background: #fff;
    border-top: 1px solid var(--border); border-radius: 0 0 30px 30px; box-shadow: 0 6px 14px rgba(0,0,0,.2); }
  .me { display: flex; align-items: center; gap: 12px; font-size: 24px; font-weight: 700; }
  .panes { flex: 1; display: flex; gap: 16px; min-height: 0; }
  .panes aside { width: 300px; background: #fff; border-radius: 30px; padding: 24px; color: var(--grey); }
  .panes main { flex: 1; background: #fff; border-radius: 30px; overflow: hidden; display: flex; flex-direction: column; }
  .placeholder { padding: 32px; color: var(--grey); }

  /* Mobile frame */
  .mob { width: 430px; height: 932px; margin: 0 auto; background: #fff; border-radius: 30px; overflow: hidden;
    display: flex; flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,.15); }
  .mob .top { display: flex; justify-content: space-between; align-items: center; background: var(--bg); padding: 16px; font-size: 20px; font-weight: 700; }
  .mob .bar { display: flex; justify-content: space-between; padding: 16px; box-shadow: 0 2px 4px rgba(0,0,0,.08); font-weight: 700; }
  .mob .search { width: calc(100% - 32px); margin: 10px 16px 4px; border: 1px solid var(--border); border-radius: 30px; padding: 12px 24px; outline: none; }
  .mob .body { flex: 1; overflow-y: auto; }

  /* Shared bits */
  .av { position: relative; display: inline-flex; flex-shrink: 0; align-items: center; justify-content: center; border-radius: 50%; color: #fff; font-weight: 700; }
  .av i { position: absolute; right: 0; bottom: 0; border: 2px solid #fff; border-radius: 50%; }
  .muted { color: var(--grey); }
  .small { font-size: 13px; }
  .xs { font-size: 12px; }
  .clamp2, .clamp3 { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; }
  .clamp2 { -webkit-line-clamp: 2; } .clamp3 { -webkit-line-clamp: 3; }
  .row { display: flex; align-items: center; gap: 12px; width: 100%; padding: 8px 24px; }
  .row:hover { background: var(--bg); color: var(--purple-2); }
  .hash { font-size: 20px; font-weight: 700; width: 36px; text-align: center; }
  .empty { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 40px 24px; text-align: center; }
  .empty .big { font-size: 36px; }
  .empty b.k { color: var(--purple); }

  /* A: grouped sections */
  .a h3 { margin: 0; padding: 14px 24px 4px; font-size: 12px; letter-spacing: .05em; text-transform: uppercase; color: var(--grey); }
  .a .msg { display: flex; gap: 12px; width: 100%; padding: 8px 24px; align-items: flex-start; }
  .a .msg:hover { background: var(--bg); }
  .a .msg .head { display: flex; align-items: baseline; gap: 8px; font-size: 14px; }
  .a .msg .conv { color: var(--purple-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .a .msg .when { margin-left: auto; flex-shrink: 0; }

  /* B: quick jump + results page */
  .b .kind { margin-left: auto; }
  .b .go { display: flex; align-items: center; gap: 12px; margin: 8px 12px 12px; width: calc(100% - 24px); padding: 12px 16px;
    border: 1px solid var(--border); border-radius: 20px; }
  .b .go:hover { background: var(--bg); }
  kbd { border: 1px solid var(--border); border-radius: 4px; padding: 0 6px; font-size: 12px; color: var(--grey); }
  .b .rhead { display: flex; align-items: center; gap: 12px; padding: 16px 24px; border-bottom: 1px solid var(--bg); }
  .b .rhead h2 { margin: 0; font-size: 22px; }
  .b .rhead button { color: var(--purple); font-size: 22px; }
  .b .list { flex: 1; overflow-y: auto; padding: 8px 24px; }
  .b .day { display: flex; align-items: center; gap: 12px; margin: 12px 0; font-size: 14px; }
  .b .day::before, .b .day::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  .b .day span { border: 1px solid var(--border); border-radius: 30px; padding: 2px 14px; }
  .b .hit { display: flex; gap: 16px; width: 100%; padding: 12px; margin-bottom: 8px; border-radius: 20px; align-items: flex-start; }
  .b .hit:hover { background: var(--bg); }
  .b .hit .conv { display: block; font-size: 12px; color: var(--purple-3); }
  .b .bubble { display: inline-block; margin-top: 4px; padding: 8px 16px; border-radius: 0 30px 30px 30px; background: var(--bg); font-size: 14px; }
  .b .hit:hover .bubble { background: #fff; }

  /* C: filter tabs */
  .c .tabs { display: flex; gap: 8px; overflow-x: auto; padding: 12px 16px; border-bottom: 1px solid var(--bg); }
  .c .tabs button { flex-shrink: 0; border: 1px solid var(--border); border-radius: 30px; padding: 4px 12px; font-size: 14px; }
  .c .tabs button.on { background: var(--purple); border-color: var(--purple); color: #fff; }
  .c .tabs button span { opacity: .7; }
  .c .ico { width: 36px; height: 36px; border-radius: 50%; background: var(--bg); color: var(--purple); font-weight: 700; font-size: 18px;
    display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .c .card { display: block; width: calc(100% - 24px); margin: 4px 12px; padding: 12px 16px; border: 1px solid var(--bg); border-radius: 20px; }
  .c .card:hover { border-color: var(--border); }
  .c .card .meta { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--grey); }
  .c .card .meta b { color: var(--purple); }
  .c .card .pill { background: var(--bg); border-radius: 30px; padding: 0 8px; }
  .c .card .meta .when { margin-left: auto; }
  .c .card .text { display: flex; gap: 8px; align-items: flex-start; margin-top: 4px; font-size: 14px; }

  /* Variant switcher (not part of the design) */
  .switcher { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 50; display: flex; align-items: center; gap: 12px;
    background: #000; color: #fff; border-radius: 30px; padding: 8px 16px; font: 14px ui-monospace, Consolas, monospace; box-shadow: 0 8px 20px rgba(0,0,0,.3); }
  .switcher button { color: #fff; padding: 0 8px; }
  .switcher button:hover { color: #fde047; }
</style>
</head>
<body>
<div class="page">
  <div class="proto" id="controls"></div>
  <div id="frame"></div>
  <div class="proto state" id="state"></div>
</div>
<div class="switcher"><button id="prev">◀</button><span id="vlabel"></span><button id="next">▶</button></div>

<script>
// ─── Fake data ───────────────────────────────────────────────────────────────
const USERS = [
  { id: 'fb', name: 'Frederik Beck', color: '#7c83f5', online: true, me: true },
  { id: 'sm', name: 'Sofia Müller', color: '#5b62e8', online: true },
  { id: 'nb', name: 'Noah Braun', color: '#2d2f8f', online: true },
  { id: 'er', name: 'Elise Roth', color: '#a3a7f7', online: false },
  { id: 'en', name: 'Elias Neumann', color: '#6d74f0', online: true },
  { id: 'sh', name: 'Steffen Hoffmann', color: '#8b5e3c', online: true },
];
const user = (id) => USERS.find((u) => u.id === id);
const CHANNELS = [
  { id: 'c1', name: 'Allgemein', members: 6 },
  { id: 'c2', name: 'Entwicklerteam', members: 3 },
  { id: 'c3', name: 'Office-team', members: 4 },
];
// Newest first, as the backend orders them. threadOf = parent Message when the hit is a Reply.
const MESSAGES = [
  { id: 'm1', sender: 'fb', conv: { kind: 'channel', name: 'Entwicklerteam' }, threadOf: 'Welche Version ist aktuell von Angular?', day: 'Heute', time: '15:06', text: 'Ja das ist es. Angular 22 ist seit Mai draußen, das Update lief bei uns ohne Probleme.' },
  { id: 'm2', sender: 'sm', conv: { kind: 'dm', name: 'Sofia Müller' }, day: 'Heute', time: '11:42', text: 'Kannst du mir den Link zum Besprechungsraum für das Angular-Review schicken?' },
  { id: 'm3', sender: 'en', conv: { kind: 'channel', name: 'Office-team' }, day: 'Gestern', time: '17:20', text: 'Der Besprechungsraum im 2. OG ist morgen ab 10 Uhr blockiert, wir weichen in Raum 3.14 aus.' },
  { id: 'm4', sender: 'sm', conv: { kind: 'channel', name: 'Entwicklerteam' }, threadOf: 'Welche Version ist aktuell von Angular?', day: 'Dienstag, 14. Januar', time: '14:30', text: 'Ich habe die gleiche Frage. Ich habe gegoogelt und es scheint, dass die aktuelle Version Angular 13 ist. Vielleicht weiß Frederik, ob es wahr ist.' },
  { id: 'm5', sender: 'nb', conv: { kind: 'channel', name: 'Entwicklerteam' }, day: 'Dienstag, 14. Januar', time: '14:25', text: 'Welche Version ist aktuell von Angular?' },
  { id: 'm6', sender: 'sh', conv: { kind: 'channel', name: 'Allgemein' }, day: '9. Januar', time: '09:12', text: 'Willkommen im Devspace! Fragen zu Angular, Kotlin oder dem Büro bitte in die passenden Channels.' },
  { id: 'm7', sender: 'er', conv: { kind: 'dm', name: 'Elise Roth' }, day: '7. Januar', time: '16:48', text: 'Danke für die Hilfe mit dem Raumplan, sieht super aus!' },
];

// ─── Search ──────────────────────────────────────────────────────────────────
const fold = (s) => s.toLowerCase().replace(/ä/g, 'a').replace(/ö/g, 'o').replace(/ü/g, 'u');
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

function segments(text, term) {
  const hay = fold(text), needle = fold(term), out = [];
  let i = 0;
  for (let at = hay.indexOf(needle); at !== -1; at = hay.indexOf(needle, at + needle.length)) {
    if (at > i) out.push({ text: text.slice(i, at), highlighted: false });
    out.push({ text: text.slice(at, at + needle.length), highlighted: true });
    i = at + needle.length;
  }
  if (i < text.length) out.push({ text: text.slice(i), highlighted: false });
  return out;
}

function search(raw) {
  const q = raw.trim();
  if (q.startsWith('@')) { const t = fold(q.slice(1)); return { q, mode: 'users', users: USERS.filter((u) => fold(u.name).includes(t)), channels: [], messages: [] }; }
  if (q.startsWith('#')) { const t = fold(q.slice(1)); return { q, mode: 'channels', users: [], channels: CHANNELS.filter((c) => fold(c.name).includes(t)), messages: [] }; }
  const t = fold(q);
  return {
    q, mode: 'all',
    users: t ? USERS.filter((u) => fold(u.name).includes(t)) : [],
    channels: t ? CHANNELS.filter((c) => fold(c.name).includes(t)) : [],
    // Min. substring length 3, as suggested in #25.
    messages: t.length >= 3 ? MESSAGES.filter((m) => fold(m.text).includes(t)).map((m) => ({ ...m, sender: user(m.sender), segs: segments(m.text, q) })) : [],
  };
}

const convLabel = (m) => (m.conv.kind === 'channel' ? '# ' + m.conv.name : m.conv.name);

function navigationFor(kind, x) {
  if (kind === 'channel') return `Öffnet den Channel # ${x.name}.`;
  if (kind === 'user') return `Öffnet die Profilkarte von ${x.name} (mit „Nachricht“-Button), wie ein @-Mention.`;
  return x.threadOf
    ? `Öffnet ${convLabel(x)}, scrollt zur Thread-Nachricht „${x.threadOf}“ und öffnet deren Thread rechts; die Antwort von ${x.sender.name} (${x.time}) wird kurz hervorgehoben. Mobil: direkt die Thread-Ansicht.`
    : `Öffnet ${convLabel(x)}, lädt die Nachrichten rund um ${x.day} ${x.time} (Keyset-Sprung) und hebt die Nachricht von ${x.sender.name} kurz hervor.`;
}

// ─── State ───────────────────────────────────────────────────────────────────
const VARIANTS = { A: 'Gruppierte Abschnitte', B: 'Schnellsprung + Ergebnisseite', C: 'Filter-Tabs' };
const PRESETS = ['angular', 'raum', 'el', '@', '#', '@el', 'xyz'];
const state = {
  variant: new URLSearchParams(location.search).get('variant') in VARIANTS ? new URLSearchParams(location.search).get('variant') : 'A',
  device: 'desktop', query: 'angular', submitted: false, tab: 'all', lastNav: null,
};
let picks = []; // click targets for the current render, indexed by data-pick

// ─── Rendering helpers ───────────────────────────────────────────────────────
function av(u, size) {
  const initials = u.name.split(' ').map((p) => p[0]).join('');
  const dot = size * 0.32;
  return `<span class="av" style="background:${u.color};width:${size}px;height:${size}px;font-size:${size * 0.38}px">${initials}` +
    `<i style="width:${dot}px;height:${dot}px;background:${u.online ? 'var(--online)' : 'var(--grey)'}"></i></span>`;
}
const snippet = (segs) => segs.map((s) => (s.highlighted ? `<mark>${esc(s.text)}</mark>` : esc(s.text))).join('');
const pick = (kind, x) => `data-pick="${picks.push({ kind, x }) - 1}"`;
const uname = (u) => esc(u.name) + (u.me ? ' (Du)' : '');

function empty(q) {
  return `<div class="empty"><div class="big">🔍</div>` +
    (q ? `<b>Keine Ergebnisse für „${esc(q)}“</b><span class="small muted">Gesucht wird in deinen Channels, bei Personen und in Nachrichten aus deinen Unterhaltungen.</span>`
       : `<span class="small muted">Suche nach Channels, Personen oder Nachrichten.</span>`) +
    `<span class="small muted">Tipp: <b class="k">@</b> für Personen, <b class="k">#</b> für Channels.</span></div>`;
}
const isEmpty = (r) => !r.users.length && !r.channels.length && !r.messages.length;

// ─── Variant A: grouped sections, everything inline ──────────────────────────
function variantA(r) {
  if (isEmpty(r)) return empty(r.q);
  let h = '<div class="a">';
  if (r.channels.length) h += '<h3>Channels</h3>' + r.channels.map((c) => `<button class="row" ${pick('channel', c)}><span class="hash">#</span>${esc(c.name)}</button>`).join('');
  if (r.users.length) h += '<h3>Personen</h3>' + r.users.map((u) => `<button class="row" ${pick('user', u)}>${av(u, 36)} ${uname(u)}</button>`).join('');
  if (r.messages.length) h += `<h3>Nachrichten · ${r.messages.length}</h3>` + r.messages.map((m) =>
    `<button class="msg" ${pick('message', m)}>${av(m.sender, 36)}<span style="flex:1;min-width:0">` +
    `<span class="head"><b>${esc(m.sender.name)}</b><span class="conv">${esc(convLabel(m))}${m.threadOf ? ' · im Thread' : ''}</span>` +
    `<span class="when xs muted">${m.day}, ${m.time}</span></span>` +
    `<span class="clamp2 small">${snippet(m.segs)}</span></span></button>`).join('');
  return h + '</div>';
}

// ─── Variant B: quick-jump dropdown + full results page for Messages ─────────
function variantBDropdown(r) {
  let h = '<div class="b" style="padding:8px 0">';
  h += r.channels.map((c) => `<button class="row" ${pick('channel', c)}><span class="hash">#</span>${esc(c.name)}<span class="kind xs muted">Channel</span></button>`).join('');
  h += r.users.map((u) => `<button class="row" ${pick('user', u)}>${av(u, 36)} ${uname(u)}<span class="kind xs muted">Person</span></button>`).join('');
  if (r.mode === 'all' && r.q) h += `<button class="go" data-submit>🔍 <span style="flex:1">Nachrichten mit „<b>${esc(r.q)}</b>“ durchsuchen</span><kbd>Enter</kbd></button>`;
  else if (!r.channels.length && !r.users.length) h += empty(r.q);
  return h + '</div>';
}
function variantBPage(r) {
  const big = state.device === 'desktop';
  let h = `<div class="b" style="display:flex;flex-direction:column;height:100%"><div class="rhead"><button data-back>←</button>` +
    `<h2 style="font-size:${big ? 22 : 18}px">${r.messages.length} Nachrichten mit „${esc(r.q)}“</h2></div>`;
  if (!r.messages.length) h += empty(r.q);
  h += '<div class="list">';
  r.messages.forEach((m, i) => {
    if (i === 0 || r.messages[i - 1].day !== m.day) h += `<div class="day"><span>${m.day}</span></div>`;
    h += `<button class="hit" ${pick('message', m)}>${av(m.sender, big ? 56 : 44)}<span style="flex:1;min-width:0">` +
      `<span class="conv">${esc(convLabel(m))}${m.threadOf ? ' › Thread: „' + esc(m.threadOf) + '“' : ''}</span>` +
      `<b>${esc(m.sender.name)}</b> <span class="xs muted">${m.time} Uhr</span><br>` +
      `<span class="bubble">${snippet(m.segs)}</span></span></button>`;
  });
  return h + '</div></div>';
}

// ─── Variant C: filter tabs over one flat list ───────────────────────────────
function variantC(r) {
  const tabs = [['all', 'Alle', r.channels.length + r.users.length + r.messages.length], ['channels', 'Channels', r.channels.length],
    ['users', 'Personen', r.users.length], ['messages', 'Nachrichten', r.messages.length]];
  const t = state.tab;
  let h = '<div class="c"><div class="tabs">' + tabs.map(([k, l, n]) => `<button class="${t === k ? 'on' : ''}" data-tab="${k}">${l} <span>${n}</span></button>`).join('') + '</div>';
  let body = '';
  if (t === 'all' || t === 'channels') body += r.channels.map((c) => `<button class="row" ${pick('channel', c)}><span class="ico">#</span><span>${esc(c.name)}<br><span class="xs muted">${c.members} Mitglieder</span></span></button>`).join('');
  if (t === 'all' || t === 'users') body += r.users.map((u) => `<button class="row" ${pick('user', u)}>${av(u, 36)}<span>${uname(u)}<br><span class="xs muted">${u.online ? 'Aktiv' : 'Abwesend'}</span></span></button>`).join('');
  if (t === 'all' || t === 'messages') body += r.messages.map((m) =>
    `<button class="card" ${pick('message', m)}><span class="meta"><b>${esc(convLabel(m))}</b>${m.threadOf ? '<span class="pill">Thread</span>' : ''}<span class="when">${m.day} · ${m.time}</span></span>` +
    `<span class="text">${av(m.sender, 24)}<span class="clamp3"><b>${esc(m.sender.name)}:</b> ${snippet(m.segs)}</span></span></button>`).join('');
  return h + (body ? `<div style="padding:8px 0">${body}</div>` : empty(r.q)) + '</div>';
}

// ─── Page ────────────────────────────────────────────────────────────────────
function results(r) {
  if (state.variant === 'A') return variantA(r);
  if (state.variant === 'C') return variantC(r);
  return state.submitted ? variantBPage(r) : variantBDropdown(r);
}

function render() {
  picks = [];
  const r = search(state.query);
  const bPage = state.variant === 'B' && state.submitted;
  const me = USERS[0];

  document.getElementById('controls').innerHTML =
    `<b>PROTOTYPE #19</b>&nbsp; Gerät: ` +
    ['desktop', 'mobile'].map((d) => `<button class="${state.device === d ? 'on' : ''}" data-device="${d}">${d}</button>`).join('') +
    `&nbsp; Beispiele: ` + PRESETS.map((p) => `<button data-preset="${esc(p)}">„${esc(p)}“</button>`).join('');

  const frame = document.getElementById('frame');
  if (state.device === 'desktop') {
    const open = !!state.query && !bPage;
    frame.innerHTML =
      `<div class="desk"><header><span class="logo">💬 DABubble</span><div class="searchwrap">` +
      `<input class="search ${open ? 'open' : ''}" id="q" placeholder="Devspace durchsuchen" value="${esc(state.query)}">` +
      (open ? `<div class="dropdown">${results(r)}</div>` : '') +
      `</div><span class="me">Frederik Beck ${av(me, 56)}</span></header>` +
      `<div class="panes"><aside>Sidebar …</aside><main>${bPage ? results(r) : '<div class="placeholder"># Entwicklerteam …</div>'}</main></div></div>`;
  } else {
    frame.innerHTML =
      `<div class="mob"><div class="top">💬 DABubble ${av(me, 50)}</div><div class="bar">Search<button data-clear>✕</button></div>` +
      `<input class="search" id="q" placeholder="Gehe zu…" value="${esc(state.query)}"><div class="body">${results(r)}</div></div>`;
  }

  document.getElementById('state').innerHTML =
    `<b>Klick führt zu:</b> ${esc(state.lastNav ?? '— (ein Ergebnis anklicken)')}<br>` +
    `<b>State:</b> variant=${state.variant} device=${state.device} query="${esc(state.query)}" submitted=${state.submitted} ` +
    `hits: ${r.channels.length} Channels, ${r.users.length} Personen, ${r.messages.length} Nachrichten`;
  document.getElementById('vlabel').textContent = `${state.variant} (${VARIANTS[state.variant]})`;
}

function setQuery(q) { state.query = q; state.submitted = false; render(); }
function focusSearch() { const el = document.getElementById('q'); el.focus(); el.setSelectionRange(el.value.length, el.value.length); }

function step(by) {
  const keys = Object.keys(VARIANTS);
  state.variant = keys[(keys.indexOf(state.variant) + by + keys.length) % keys.length];
  state.submitted = false;
  const url = new URL(location.href);
  url.searchParams.set('variant', state.variant);
  history.replaceState(null, '', url);
  render();
}

// ─── Events ──────────────────────────────────────────────────────────────────
document.addEventListener('input', (e) => { if (e.target.id === 'q') { setQuery(e.target.value); focusSearch(); } });
document.addEventListener('keydown', (e) => {
  if (e.target.id === 'q') {
    if (e.key === 'Enter') { state.submitted = true; render(); }
    if (e.key === 'Escape') { setQuery(''); focusSearch(); }
    return;
  }
  if (e.target.closest('input, textarea, [contenteditable]')) return;
  if (e.key === 'ArrowLeft') step(-1);
  if (e.key === 'ArrowRight') step(1);
});
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-pick],[data-submit],[data-back],[data-tab],[data-device],[data-preset],[data-clear]');
  if (!el) return;
  const d = el.dataset;
  if ('pick' in d) { const p = picks[+d.pick]; state.lastNav = navigationFor(p.kind, p.x); }
  else if ('submit' in d) state.submitted = true;
  else if ('back' in d) state.submitted = false;
  else if ('tab' in d) state.tab = d.tab;
  else if ('device' in d) state.device = d.device;
  else if ('preset' in d) { state.query = d.preset; state.submitted = false; }
  else if ('clear' in d) { state.query = ''; state.submitted = false; }
  render();
});
document.getElementById('prev').onclick = () => step(-1);
document.getElementById('next').onclick = () => step(1);

render();
</script>
</body>
</html>
