# Hand-written DA Bubble login theme: no PatternFly, styled with the app's design tokens.
# Every page goes through template.ftl; resources/css/login.css is built by
# `npm run build:keycloak-theme` in frontend/.
parent=base
locales=de,en
styles=css/login.css
meta=viewport==width=device-width,initial-scale=1

# Where the Angular app runs, for the Impressum and Datenschutz links.
appBaseUrl=${env.APP_BASE_URL:http://localhost:4200}

# The Guest's password for the Gäste-Login form; must match the realm import's GUEST_PASSWORD default.
guestPassword=${env.GUEST_PASSWORD:guest-dev-password}
